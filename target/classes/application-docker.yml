    secret: ${JWT_SECRET:b3BlbnNlc2FtZS1sb2NhbHN0YWNrLWp3dC1zZWNyZXQta2V5LXRoYXQtaXMtbG9uZy1lbm91Z2gtZm9yLUhTNTEy}
