# =============================================================================
# Spring profile: local  (Spring Boot runs on your machine — NOT inside Docker)
# Activate:  mvn spring-boot:run -Dspring-boot.run.profiles=local
# =============================================================================
# Typical workflow: start only infra in Docker, then run the app locally:
#   docker compose up mysql localstack -d
# Then MySQL is on localhost:3307 and LocalStack on localhost:4566 (see docker-compose.yml ports).
#
# --- Docker-in-app profile (REFERENCE ONLY — commented out) -------------------
# If you copied settings from the docker profile, you would use hostnames "mysql" and
# "localstack" — those only resolve INSIDE the Compose network. On the host JVM they fail.
# Example (do not uncomment for local profile):
#   spring.datasource.url: jdbc:mysql://mysql:3306/authdb   # WRONG on host
#   app.aws.endpoint: http://localstack:4566               # WRONG on host
# -----------------------------------------------------------------------------

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/authdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: appuser
    password: apppassword
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true

app:
  jwt:
    secret: b3BlbnNlc2FtZS1sb2NhbHN0YWNrLWp3dC1zZWNyZXQta2V5LXRoYXQtaXMtbG9uZy1lbm91Z2gtZm9yLUhTNTEy
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 86400000

  aws:
    # LocalStack reachable from the host (mapped port from docker-compose localstack service)
    endpoint: http://localhost:4566
    region: us-east-1
    s3:
      bucket-name: user-profiles
    ses:
      from-email: noreply@authapp.local
