spring:
  application:
    name: localstack-docker-app

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# HTTP port (override: SERVER_PORT env var, e.g. SERVER_PORT=9090)
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# Optional defaults (override per profile: application-docker.yml, application-local.yml)
# app:
#   aws:
#     endpoint:   # empty = real AWS (DefaultCredentialsProvider). Non-empty = LocalStack URL.
#     region: us-east-1
