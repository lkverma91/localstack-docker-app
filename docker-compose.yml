# Compose stack: MySQL + LocalStack + Spring Boot app (recommended).
# LocalStack: S3, SES, SSM — init-aws.sh seeds bucket + SES identity + SSM params.
# App uses SPRING_PROFILES_ACTIVE=docker → application-docker.yml (localstack:4566, mysql:3306).

services:
  mysql:
    image: mysql:8.0
    container_name: auth-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: authdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  localstack:
    image: localstack/localstack:3.4
    container_name: auth-localstack
    environment:
      - SERVICES=s3,ses,ssm
      - DEBUG=0
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "4566:4566"
    volumes:
      - "./init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"
      - localstack-data:/var/lib/localstack
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      # Host machine port : app port inside container (fixed 8080; matches Dockerfile HEALTHCHECK)
      # Example: APP_HOST_PORT=9090 → http://localhost:9090
      - "${APP_HOST_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      localstack:
        condition: service_started
    networks:
      - app-network

volumes:
  mysql-data:
  localstack-data:

networks:
  app-network:
    driver: bridge
